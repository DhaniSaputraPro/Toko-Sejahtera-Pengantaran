<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover supaya bilah atas/bawah bisa menghormati poni dan
         bilah gestur; padding-nya dibaca dari env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <!-- Satu theme-color saja; isinya ditulis ulang `src/lib/tema.ts` sesuai
         tema yang benar-benar tampil, termasuk saat kurir memilih sendiri. -->
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Aplikasi pengantaran Toko Sejahtera — daftar antar dan navigasi."
    />
    <!-- Daftar antar memuat alamat rumah pembeli. Tidak ada satu pun bagian
         aplikasi ini yang boleh muncul di hasil pencarian. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pengantaran" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/ikon.svg" />
    <link rel="apple-touch-icon" href="/ikon-180.png" />
    <title>Pengantaran Toko Sejahtera</title>
  </head>
  <body>
    <div id="akar"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
